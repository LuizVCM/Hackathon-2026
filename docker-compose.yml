services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: consulta_mais
      MYSQL_USER: consulta
      MYSQL_PASSWORD: consulta_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - consulta_sql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
volumes:
  consulta_sql:
